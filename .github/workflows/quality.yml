name: Validate profile engine

on:
  push:
    branches: [main, systems-lab-v1, repository-genome-v1]
    paths:
      - "README.md"
      - "profile.config.json"
      - "data/**"
      - "scripts/**"
      - "assets/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "README.md"
      - "profile.config.json"
      - "data/**"
      - "scripts/**"
      - "assets/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Render generated assets
        run: |
          python3 scripts/render_portrait_terminal.py
          python3 scripts/render_signal_icons.py
          python3 scripts/render_repository_genome.py
          python3 scripts/render_lab.py
          python3 scripts/render_signal_array.py

      - name: Validate assets and README
        run: python3 scripts/validate_assets.py
