name: Refresh systems intelligence profile

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-profile
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch public GitHub data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/fetch_profile_data.py

      - name: Render systems dashboard assets
        run: |
          python3 scripts/render_lab.py
          python3 scripts/render_signal_array.py

      - name: Validate profile assets
        run: python3 scripts/validate_assets.py

      - name: Commit refreshed profile assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/profile.json assets/generated/*.svg assets/fallback/*.svg
          git diff --cached --quiet || (git commit -m "chore: refresh profile telemetry [skip ci]" && git push)
