<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="720" viewBox="0 0 1180 720" role="img" aria-labelledby="title desc">
  <title id="title">Aditya — HazaVVIP Signal Array</title>
  <desc id="desc">A cinematic systems intelligence profile visual mapping HazaVVIP repositories into recon, packet, and automation signals.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111F"/>
      <stop offset="0.52" stop-color="#0B1A2E"/>
      <stop offset="1" stop-color="#0F243B"/>
    </linearGradient>
    <radialGradient id="core" cx="48%" cy="44%" r="66%">
      <stop offset="0" stop-color="#22D3EE" stop-opacity=".95"/>
      <stop offset=".18" stop-color="#A78BFA" stop-opacity=".68"/>
      <stop offset=".52" stop-color="#0F243B" stop-opacity=".88"/>
      <stop offset="1" stop-color="#07111F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset=".45" stop-color="#22D3EE" stop-opacity=".8"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset=".5" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1B4662" stroke-width="1" opacity=".28"/>
    </pattern>
    <pattern id="fineGrid" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M 8 0 L 0 0 0 8" fill="none" stroke="#22D3EE" stroke-width=".5" opacity=".14"/>
    </pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="smallGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .breathe { animation: breathe 4s ease-in-out infinite; transform-origin: 440px 340px; }
      .orbit { animation: orbit 18s linear infinite; transform-origin: 440px 340px; }
      .scan { animation: scan 6s linear infinite; }
      .blink { animation: blink 2.6s ease-in-out infinite; }
      @keyframes breathe { 0%,100% { opacity:.55; } 50% { opacity:1; } }
      @keyframes orbit { to { transform: rotate(360deg); } }
      @keyframes scan { 0% { transform: translateX(-500px); opacity:0; } 20% { opacity:.5; } 80% { opacity:.5; } 100% { transform: translateX(920px); opacity:0; } }
      @keyframes blink { 0%,100% { opacity:.3; } 50% { opacity:1; } }
    </style>
  </defs>
