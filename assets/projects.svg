<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="300" viewBox="0 0 1180 300" role="img" aria-labelledby="title desc">
  <title id="title">Selected HazaVVIP projects</title>
  <desc id="desc">A project showcase with three selected public repositories</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a101f"/>
      <stop offset="1" stop-color="#111c35"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect x="10" y="10" width="1160" height="280" rx="22" fill="url(#bg)" stroke="#203454" stroke-width="2"/>
  <text x="50" y="58" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="26" font-weight="800" fill="#22d3ee">Selected projects</text>
  <rect x="50" y="76" width="210" height="4" rx="2" fill="url(#line)"/>
  <g font-family="system-ui, -apple-system, Segoe UI, sans-serif">
    <a href="https://github.com/HazaVVIP/GitRecon" target="_blank">
      <rect x="50" y="106" width="330" height="135" rx="14" fill="#111d36" stroke="#2b426b"/>
      <text x="75" y="145" font-size="20" font-weight="700" fill="#f8fafc">GitRecon</text>
      <text x="75" y="174" font-size="14" fill="#94a3b8">Security and reconnaissance</text>
      <text x="75" y="205" font-size="13" fill="#22d3ee">Explore repository →</text>
    </a>
    <a href="https://github.com/HazaVVIP/haquests" target="_blank">
      <rect x="425" y="106" width="330" height="135" rx="14" fill="#111d36" stroke="#2b426b"/>
      <text x="450" y="145" font-size="20" font-weight="700" fill="#f8fafc">haquests</text>
      <text x="450" y="174" font-size="14" fill="#94a3b8">Low-level packet crafting</text>
      <text x="450" y="205" font-size="13" fill="#a78bfa">Explore repository →</text>
    </a>
    <a href="https://github.com/HazaVVIP/telemetry" target="_blank">
      <rect x="800" y="106" width="330" height="135" rx="14" fill="#111d36" stroke="#2b426b"/>
      <text x="825" y="145" font-size="20" font-weight="700" fill="#f8fafc">telemetry</text>
      <text x="825" y="174" font-size="14" fill="#94a3b8">Web application project</text>
      <text x="825" y="205" font-size="13" fill="#10b981">Explore repository →</text>
